<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>停车场系统</title>
<style>
:root {
    --bg-1: #f8fff3;
    --bg-2: #eaf7ff;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #5b6475;
    --accent: #0f766e;
    --accent-2: #065f46;
    --warn: #b91c1c;
    --ok: #14532d;
    --shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.22), transparent 35%),
        radial-gradient(circle at 88% 14%, rgba(59, 130, 246, 0.2), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
    display: grid;
    place-items: center;
    padding: 24px;
}

.shell {
    width: min(760px, 96vw);
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow: var(--shadow);
    border-radius: var(--radius);
    backdrop-filter: blur(8px);
    overflow: hidden;
}

.header {
    padding: 22px 24px 14px;
    background: linear-gradient(120deg, rgba(15, 118, 110, 0.12), rgba(2, 132, 199, 0.12));
    border-bottom: 1px solid rgba(15, 118, 110, 0.14);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
}

.header h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 0.5px;
}

.header p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.spaces-chip {
    background: rgba(15, 118, 110, 0.12);
    border: 1px solid rgba(15, 118, 110, 0.25);
    color: var(--accent-2);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
}

.main {
    padding: 22px 24px 28px;
}

.field-label {
    display: block;
    font-weight: 700;
    margin-bottom: 10px;
}

/* 图片获取按钮: 拍摄 / 相册 */
.pick-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.pick-btn {
    border: 1.5px dashed rgba(15, 118, 110, 0.45);
    background: rgba(15, 118, 110, 0.05);
    color: var(--accent-2);
    border-radius: 12px;
    padding: 14px 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
}

.pick-btn:hover {
    background: rgba(15, 118, 110, 0.12);
    transform: translateY(-1px);
}

/* 图片预览 */
.preview-wrap {
    margin-top: 14px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: #f8fafc;
    min-height: 120px;
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 8px;
}

.preview-wrap img {
    max-width: 100%;
    max-height: 260px;
    border-radius: 8px;
    display: none;
}

.preview-placeholder {
    color: var(--muted);
    font-size: 13px;
}

.hint {
    margin-top: 10px;
    color: var(--muted);
    font-size: 13px;
}

/* 入场 / 出场操作按钮 */
.action-row {
    margin-top: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
}

.upload-btn {
    border: none;
    border-radius: 12px;
    padding: 13px 10px;
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
}

.upload-btn.entry {
    background: linear-gradient(135deg, #059669, #065f46);
}

.upload-btn.exit {
    background: linear-gradient(135deg, #dc6803, #b54708);
}

.upload-btn.auto {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
}

.upload-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
}

.upload-btn:disabled {
    cursor: not-allowed;
    filter: grayscale(0.3) brightness(0.8);
    transform: none;
}

/* 上传进度提示 */
.progress {
    display: none;
    margin-top: 14px;
    align-items: center;
    gap: 10px;
    color: var(--accent-2);
    font-size: 14px;
    font-weight: 600;
}

.progress.show {
    display: flex;
}

.spinner {
    width: 18px;
    height: 18px;
    border: 3px solid rgba(15, 118, 110, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.status-panel {
    margin-top: 18px;
    border: 1px solid #e5e7eb;
    background: #fbfdff;
    border-radius: 12px;
    padding: 14px;
}

.status-title {
    margin: 0 0 8px;
    font-size: 14px;
    color: var(--muted);
}

#result {
    margin: 0;
    white-space: pre-wrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 13px;
    color: #1e293b;
}

.footer-link {
    margin-top: 14px;
    text-align: center;
    font-size: 13px;
}

.footer-link a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
}

.modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    z-index: 50;
}

.modal.show {
    display: flex;
    animation: fadeIn 0.2s ease;
}

.dialog {
    width: min(480px, 95vw);
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 22px 44px rgba(2, 6, 23, 0.28);
    padding: 18px 18px 16px;
    transform: translateY(8px);
    animation: riseIn 0.22s ease forwards;
}

.dialog h3 {
    margin: 0 0 8px;
    font-size: 20px;
}

.dialog .lines {
    margin: 0;
    padding-left: 18px;
    color: #1f2937;
    line-height: 1.6;
}

.dialog .lines li {
    margin-bottom: 2px;
}

.dialog .ok-wrap {
    display: flex;
    justify-content: flex-end;
    margin-top: 16px;
}

.ok-btn {
    min-width: 92px;
    border: none;
    border-radius: 10px;
    padding: 9px 16px;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(135deg, #0ea5e9, #0369a1);
    cursor: pointer;
}

.ok-btn.error {
    background: linear-gradient(135deg, #dc2626, #991b1b);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 640px) {
    .action-row {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="shell">
    <div class="header">
        <div>
            <h1>停车场车牌识别系统</h1>
            <p>拍摄或选择车牌图片，选择入场 / 出场通道后上传识别。</p>
        </div>
        <span class="spaces-chip" id="spaces-chip">车位加载中...</span>
    </div>

    <div class="main">
        <label class="field-label">第一步：获取车牌图片</label>
        <div class="pick-row">
            <button class="pick-btn" type="button" onclick="cameraInput.click()">📷 拍摄车牌</button>
            <button class="pick-btn" type="button" onclick="albumInput.click()">🖼 从相册选择</button>
        </div>
        <!-- capture=environment 调用手机后置摄像头；无 capture 则打开相册 -->
        <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
        <input type="file" id="album-input" accept="image/*" hidden>

        <div class="preview-wrap">
            <img id="preview-img" alt="车牌图片预览">
            <span class="preview-placeholder" id="preview-placeholder">尚未选择图片，预览将显示在这里。</span>
        </div>
        <p class="hint" id="file-hint">请拍摄或上传清晰、正向的车牌图片。</p>

        <label class="field-label" style="margin-top:18px;">第二步：选择通道并上传识别</label>
        <div class="action-row">
            <button class="upload-btn entry" data-channel="entry" onclick="upload('entry')">入场识别</button>
            <button class="upload-btn exit" data-channel="exit" onclick="upload('exit')">出场识别</button>
            <button class="upload-btn auto" data-channel="auto" onclick="upload('auto')">智能判断</button>
        </div>

        <div class="progress" id="progress">
            <span class="spinner"></span>
            <span>图片上传中，服务器识别中，请稍候...</span>
        </div>

        <div class="status-panel">
            <p class="status-title">最近一次响应</p>
            <p id="result">暂无记录</p>
        </div>

        <p class="footer-link"><a href="/admin">管理员后台：查看出入场记录 →</a></p>
    </div>
</div>

<div class="modal" id="msg-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="dialog">
        <h3 id="modal-title">结果提示</h3>
        <ul class="lines" id="modal-lines"></ul>
        <div class="ok-wrap">
            <button class="ok-btn" id="ok-btn" onclick="closeModal()">确定</button>
        </div>
    </div>
</div>


<script>
const cameraInput = document.getElementById("camera-input");
const albumInput = document.getElementById("album-input");
const previewImg = document.getElementById("preview-img");
const previewPlaceholder = document.getElementById("preview-placeholder");
const resultEl = document.getElementById("result");
const fileHint = document.getElementById("file-hint");
const progressEl = document.getElementById("progress");
const spacesChip = document.getElementById("spaces-chip");
const actionBtns = document.querySelectorAll(".action-row .upload-btn");

// 当前待上传的图片文件（来自拍摄或相册）
let selectedFile = null;
let previewUrl = null;

function onFilePicked(input, sourceName){
    const file = input.files[0];
    if (!file) return;
    selectedFile = file;

    // 图片预览
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    previewUrl = URL.createObjectURL(file);
    previewImg.src = previewUrl;
    previewImg.style.display = "block";
    previewPlaceholder.style.display = "none";

    fileHint.textContent = `已${sourceName}: ${file.name} (${Math.round(file.size / 1024)} KB)`;
    // 清空 value，保证同一文件可重复选择
    input.value = "";
}

cameraInput.addEventListener("change", () => onFilePicked(cameraInput, "拍摄图片"));
albumInput.addEventListener("change", () => onFilePicked(albumInput, "选择图片"));

// 加载剩余车位信息
async function refreshSpaces(){
    try {
        const res = await fetch("/spaces");
        const data = await res.json();
        spacesChip.textContent = `剩余车位 ${data.remaining}/${data.total_spots} · 费率 ${data.fee_per_hour} 元/时`;
    } catch (err) {
        spacesChip.textContent = "车位信息获取失败";
    }
}
refreshSpaces();

function openModal(title, lines, isError){
    const modal = document.getElementById("msg-modal");
    const titleEl = document.getElementById("modal-title");
    const linesEl = document.getElementById("modal-lines");
    const okBtn = document.getElementById("ok-btn");

    titleEl.textContent = title;
    linesEl.innerHTML = "";
    lines.forEach(line => {
        const li = document.createElement("li");
        li.textContent = line;
        linesEl.appendChild(li);
    });

    okBtn.classList.toggle("error", Boolean(isError));
    modal.classList.add("show");
}

function closeModal(){
    document.getElementById("msg-modal").classList.remove("show");
}

const CHANNEL_NAMES = { entry: "入场", exit: "出场", auto: "智能判断" };

async function upload(channel){
    if (!selectedFile) {
        openModal("上传失败", ["请先拍摄或从相册选择一张车牌图片。"], true);
        return;
    }

    actionBtns.forEach(btn => btn.disabled = true);
    progressEl.classList.add("show");

    const formData = new FormData();
    formData.append("image", selectedFile);
    formData.append("channel", channel);

    try {
        const res = await fetch("/upload", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);

        const detailLines = [`通道: ${CHANNEL_NAMES[channel]}`];
        if (data.msg) {
            detailLines.push(`消息: ${data.msg}`);
        }
        if (data.plate) {
            detailLines.push(`车牌号: ${data.plate}`);
        }
        if (data.type) {
            detailLines.push(`结果: ${data.type}`);
        }
        if (data.enter_time) {
            detailLines.push(`入场时间: ${data.enter_time}`);
        }
        if (data.time) {
            detailLines.push(`时间: ${data.time}`);
        }
        if (data.duration_minutes !== undefined) {
            detailLines.push(`停车时长: ${data.duration_minutes} 分钟`);
        }
        if (data.fee !== undefined) {
            detailLines.push(`费用: ${data.fee} 元`);
        }
        if (data.remaining_spots !== undefined) {
            detailLines.push(`剩余车位: ${data.remaining_spots}`);
        }
        if (detailLines.length === 1) {
            detailLines.push("服务端返回了空消息，请检查后端日志。");
        }

        openModal(res.ok ? "处理完成" : "处理失败", detailLines, !res.ok);
        refreshSpaces();
    } catch (err) {
        resultEl.textContent = `请求异常: ${err}`;
        openModal("网络异常", ["请求未成功，请确认服务器正在运行并重试。"], true);
    } finally {
        actionBtns.forEach(btn => btn.disabled = false);
        progressEl.classList.remove("show");
    }
}

document.addEventListener("keydown", (evt) => {
    if (evt.key === "Escape") {
        closeModal();
    }
});
</script>

</body>
</html>
