services:
  mysql:
    image: mysql:8.4
    container_name: rust_lab_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rust_lab

  postgres:
    image: postgres:16
    container_name: rust_lab_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rust_lab
